# nginx config for staging.invoicor.com (ROADMAP chunk 26): the same static site as production,
# behind a password and hidden from search engines. Upload with: bash deploy/deploy.sh --staging
#
# One-time setup on the server (see DEPLOY.md, "Staging"):
#   1. DNS: A record staging.invoicor.com -> the server IP
#   2. sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd-staging invoicor
#   3. Copy this file to /etc/nginx/sites-available/, link it into sites-enabled/
#   4. sudo certbot --nginx -d staging.invoicor.com   (adds the ssl_certificate lines)
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name staging.invoicor.com;
    return 301 https://staging.invoicor.com$request_uri;
}

server {
    listen 443 ssl http2;        # nginx 1.24 syntax; on 1.25.1+ use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name staging.invoicor.com;

    # ssl_certificate lines are added by certbot (step 4)

    root /var/www/staging.invoicor.com/site;   # = $STAGING_DIR/site
    index index.html;

    auth_basic "Invoicor staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Same old-URL redirects as production (keep in sync with invoicor.com.conf)
    location = /pricing             { return 301 /#pricing; }
    location = /register            { return 301 /; }
    location = /og-image.jpg        { return 301 /og.png; }
    location = /logo.jpg            { return 301 /icons/icon-512.png; }
    location = /icon.jpg            { return 301 /icons/icon-512.png; }
    location = /favicon-16x16.jpg   { return 301 /icon.png; }
    location = /favicon-32x32.jpg   { return 301 /icon.png; }
    location = /favicon.ico         { return 301 /icon.png; }

    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
