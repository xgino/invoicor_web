# nginx config for invoicor.com (static Next.js export + Django API)
#
# HOW TO USE: compare with your current file (`grep -rln invoicor /etc/nginx/sites-enabled/`).
#   - Keep your existing ssl_certificate lines (certbot manages them).
#   - Keep your existing /api/ (and /admin/, /static/, /media/) proxy blocks exactly as they are,
#     only add "^~" after "location" as shown, so they win over the rules below.
#   - Set `root` to $SITE_DIR/site from deploy/.env.
# Written for nginx 1.24 (Ubuntu 24.04). Check yours with: nginx -v
# Then: sudo nginx -t && sudo systemctl reload nginx

# http -> https, and www -> apex (one hop)
server {
    listen 80;
    listen [::]:80;
    server_name invoicor.com www.invoicor.com;
    return 301 https://invoicor.com$request_uri;
}

# https://www -> https://apex
server {
    listen 443 ssl http2;        # nginx 1.24 syntax; on 1.25.1+ use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.invoicor.com;

    # ssl_certificate     /etc/letsencrypt/live/invoicor.com/fullchain.pem;   # keep yours
    # ssl_certificate_key /etc/letsencrypt/live/invoicor.com/privkey.pem;     # keep yours

    return 301 https://invoicor.com$request_uri;
}

server {
    listen 443 ssl http2;        # nginx 1.24 syntax; on 1.25.1+ use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name invoicor.com;

    # ssl_certificate     /etc/letsencrypt/live/invoicor.com/fullchain.pem;   # keep yours
    # ssl_certificate_key /etc/letsencrypt/live/invoicor.com/privkey.pem;     # keep yours

    root /var/www/invoicor.com/site;   # = $SITE_DIR/site
    index index.html;

    # ── Django (keep your existing proxy settings inside these blocks) ──
    location ^~ /api/ {
        # proxy_pass http://127.0.0.1:8000;   # keep yours
        # include proxy_params;               # keep yours
    }
    # location ^~ /admin/  { ... }   # keep yours, if you have it
    # location ^~ /static/ { ... }   # keep yours, if you have it
    # location ^~ /media/  { ... }   # keep yours, if you have it

    # ── Website ──
    # Old URLs from the Vite site (keep: search engines and social sites cached them)
    location = /pricing             { return 301 /#pricing; }
    location = /register            { return 301 /; }          # old CTA target, never a page
    location = /og-image.jpg        { return 301 /og.png; }
    location = /logo.jpg            { return 301 /icons/icon-512.png; }
    location = /icon.jpg            { return 301 /icons/icon-512.png; }
    location = /favicon-16x16.jpg   { return 301 /icon.png; }
    location = /favicon-32x32.jpg   { return 301 /icon.png; }
    location = /favicon.ico         { return 301 /icon.png; }

    # Hashed build assets never change: cache for a year
    # (nginx: a location with its own add_header drops the server-level ones,
    #  so each block below repeats the security headers.)
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        # /templates/plumbing/ -> /templates/plumbing (one canonical URL per page)
        rewrite ^/(.+)/$ /$1 permanent;
        # HTML and other files: always revalidate, so a new deploy shows immediately
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # /templates/plumbing -> templates/plumbing.html
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Real 404 status with the branded page
    error_page 404 /404.html;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml
               application/manifest+json image/svg+xml;

    # Security headers for everything else (redirects, error pages)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
