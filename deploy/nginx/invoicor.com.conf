# nginx for invoicor.com: the static website (this repo) + the Django API (invoicor_api).
#
# Written from the server's current file (deploy/server-info.txt, 2026-11-18):
#   /etc/nginx/sites-available/invoicor  (enabled as sites-enabled/invoicor), nginx 1.24.
# `bash deploy/setup.sh launch` backs that file up, puts this one in its place, tests it and checks
# the live site; it puts the old file back by itself if anything fails.
#
# Kept exactly from the current file: the certificate lines (certbot), the /api/ and /admin/ blocks
# (gunicorn socket /run/invoicor.sock), /static/ and /media/. Only `^~` was added to those four
# locations, so they always win over the website rules below.
# Changed: the website comes from /var/www/invoicor.com/web/current (was the Vite site in dist/),
# with real 404s, page files without .html, caching, security headers and the old-URL redirects.
# No IPv6 or HTTP/2 listen flags: the other sites on this server don't use them on 443 either,
# and in nginx 1.24 they'd change those sites too.

# http -> https, and www -> apex in one hop
server {
    listen 80;
    server_name invoicor.com www.invoicor.com;
    return 301 https://invoicor.com$request_uri;
}

# https://www -> https://apex
server {
    listen 443 ssl;
    server_name www.invoicor.com;

    ssl_certificate /etc/letsencrypt/live/invoicor.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/invoicor.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://invoicor.com$request_uri;
}

server {
    listen 443 ssl;
    server_name invoicor.com;

    ssl_certificate /etc/letsencrypt/live/invoicor.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/invoicor.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/invoicor.com/web/current;
    index index.html;

    # ── Django: unchanged from the current file ──
    location ^~ /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/invoicor.sock;
    }

    location ^~ /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/invoicor.sock;
    }

    # Django static files
    location ^~ /static/ {
        alias /var/www/invoicor.com/static/;
    }

    # Django media
    location ^~ /media/ {
        alias /var/www/invoicor.com/media/;
    }

    # ── Website ──
    # Old URLs from the Vite site (search engines and social sites cached them)
    location = /pricing             { return 301 /#pricing; }
    location = /register            { return 301 /; }          # old CTA target, never a page
    location = /og-image.jpg        { return 301 /og.png; }
    location = /logo.jpg            { return 301 /icons/icon-512.png; }
    location = /icon.jpg            { return 301 /icons/icon-512.png; }
    location = /favicon-16x16.jpg   { return 301 /icon.png; }
    location = /favicon-32x32.jpg   { return 301 /icon.png; }
    location = /favicon.ico         { return 301 /icon.png; }

    # Hashed build files never change: cache for a year
    # (a location with its own add_header drops the server-level ones, so each repeats them)
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        # /templates/plumbing/ -> /templates/plumbing (one URL per page)
        rewrite ^/(.+)/$ /$1 permanent;
        # Pages and other files: always revalidate, so a new deploy shows straight away
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # /templates/plumbing -> templates/plumbing.html
        try_files $uri $uri.html $uri/index.html =404;
    }

    # A real 404 status, with the site's own page
    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml
               application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
