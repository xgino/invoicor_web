# Runs the same checks as `npm run check` on every push and pull request.
# Browser tests use the Google Chrome that GitHub's Ubuntu runners have installed.
# It doesn't deploy: deploying stays manual (see DEPLOY.md).
name: check

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:site
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
